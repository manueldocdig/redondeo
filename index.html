<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E3B4C" />
    <meta name="robots" content="noindex" />
    <title>Ruta del redondeo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2312805C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Inicio de sesión -->
    <section id="login" class="login" hidden>
      <form id="form-login" class="login-caja">
        <img class="login-logo" src="/logo.jpg" width="1000" height="333" alt="Fundación Nicoya y Ministerio Buen Samaritano" />
        <h1 class="login-titulo">Ruta del redondeo</h1>
        <p class="login-texto">Entra con el usuario y la contraseña del equipo.</p>
        <label class="campo">
          <span>Usuario</span>
          <input name="usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        </label>
        <label class="campo">
          <span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button class="btn btn-primario" type="submit">Entrar</button>
      </form>
    </section>

    <!-- ¿Quién eres? (una vez por celular) -->
    <section id="quien" class="login" hidden>
      <div class="login-caja">
        <h1 class="login-titulo">¿Quién eres?</h1>
        <p class="login-texto">Las tiendas que tomes y visites quedarán a tu nombre. Solo se pregunta una vez en este celular.</p>
        <div id="quien-nombres" class="quien-nombres"></div>
      </div>
    </section>

    <!-- App -->
    <section id="app" class="app" hidden>
      <header class="barra">
        <button id="btn-quien" class="yo" type="button" aria-label="Cambiar de persona"></button>
        <button id="btn-equipo" class="avance" type="button" aria-label="Ver avance del equipo">
          <span class="avance-cifras">
            <strong id="avance-hechas">0</strong>
            <span class="avance-de">de <span id="avance-meta">163</span></span>
          </span>
          <span class="avance-pista" aria-hidden="true">
            <span id="avance-barra" class="avance-barra"></span>
            <span id="avance-meta-marca" class="avance-meta-marca"></span>
          </span>
          <span id="avance-texto" class="avance-texto">Cargando tiendas…</span>
        </button>
      </header>

      <div class="herramientas">
        <input id="buscar" class="buscar" type="search" placeholder="Buscar tienda, colonia o CR" autocomplete="off" />
        <div id="filtros" class="filtros" role="tablist" aria-label="Filtrar tiendas"></div>
      </div>

      <div id="mapa" class="mapa" aria-label="Mapa de tiendas"></div>

      <div class="flotantes">
        <button id="btn-ubicacion" class="flotante" type="button" aria-label="Centrar en mi ubicación">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="btn-lista" class="flotante flotante-texto" type="button">Lista</button>
      </div>

      <aside id="panel" class="panel" hidden aria-live="polite">
        <button id="panel-cerrar" class="panel-cerrar" type="button" aria-label="Cerrar">×</button>
        <div id="panel-contenido"></div>
      </aside>

      <div id="aviso" class="aviso" role="status" hidden></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
